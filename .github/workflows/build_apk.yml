name: ZIP Aç ve Klasik APK Derle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: ZIP Dosyasını Klasöre Çıkar (Unzip)
        run: |
          sudo apt-get install -y unzip
          unzip kaynak.zip-d kaynak_kodlar
          # Çıkarılan dosyaları ana dizine taşıyoruz ki robot görebilsin
          mv kaynak_kodlar/* . || true
          mv kaynak_kodlar/.* . || true

      - name: Java Kurulumu (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Gradle Dosyasını Bul ve Çalıştır
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          if [ -z "$GRADLEW_PATH" ]; then
            sudo apt-get update && sudo apt-get install -y gradle
            gradle assembleRelease
          else
            chmod +x $GRADLEW_PATH
            cd $(dirname "$GRADLEW_PATH")
            ./gradlew assembleRelease
          fi

      - name: Üretilen APK'yı İndirmeye Hazırla
        uses: actions/upload-artifact@v4
        with:
          name: ZIP-Uygulamam-APK
          path: "**/build/outputs/apk/release/*.apk"
          
